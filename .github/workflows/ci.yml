name: RideLink CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  account-service:
    name: Account Service - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Account Service
        working-directory: account-service
        run: mvn clean test

  driver-vehicle-service:
    name: Driver-Vehicle Service - Build & Test
    runs-on: ubuntu-latest

    steps:
