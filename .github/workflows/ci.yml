name: Driver Vehicle Service CI

on:
  push:
    branches:
      - main
      - feature/driver-vehicle-service

  pull_request:
    branches:
      - main
      - feature/driver-vehicle-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: driver-vehicle-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify
